<main class="register">
  <h1 class="title">{{ t().registerTitle }}</h1>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="register-email">{{ t().registerEmailLabel }}</label>
      <input
        #emailInput
        id="register-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="emailError() ? 'true' : null"
        [attr.aria-describedby]="emailError() ? 'register-email-error' : null"
      />
      <p id="register-email-error" class="error" aria-live="polite">
        @if (emailError(); as code) {
          {{ message(code) }}
        }
      </p>
    </div>
    <div class="field">
      <label for="register-password">{{ t().registerPasswordLabel }}</label>
      <input
        #passwordInput
        id="register-password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        [attr.aria-invalid]="passwordError() ? 'true' : null"
        [attr.aria-describedby]="
          passwordError() ? 'register-password-hint register-password-error' : 'register-password-hint'
        "
      />
      <p id="register-password-hint" class="hint">{{ t().registerPasswordHint }}</p>
      <p id="register-password-error" class="error" aria-live="polite">
        @if (passwordError(); as code) {
          {{ message(code) }}
        }
      </p>
    </div>
    <p class="error form-error" aria-live="polite">
      @if (formError(); as code) {
        {{ message(code) }}
      }
    </p>
    <button class="submit" type="submit" [disabled]="pending()">{{ t().registerSubmit }}</button>
  </form>
  <p class="alt">
    {{ t().registerHaveAccount }}
    <a routerLink="/login">{{ t().registerLoginLink }}</a>
  </p>
</main>
