<main class="login">
  <h1 class="title">{{ t().loginTitle }}</h1>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="login-email">{{ t().loginEmailLabel }}</label>
      <input
        #emailInput
        id="login-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="emailError() ? 'true' : null"
        [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
      />
      <p id="login-email-error" class="error" aria-live="polite">
        @if (emailError(); as code) {
          {{ message(code) }}
        }
      </p>
    </div>
    <div class="field">
      <label for="login-password">{{ t().loginPasswordLabel }}</label>
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
      />
    </div>
    <p class="error form-error" aria-live="polite">
      @if (formError(); as code) {
        {{ message(code) }}
      }
    </p>
    <button class="submit" type="submit" [disabled]="pending()">{{ t().loginSubmit }}</button>
  </form>
  <p class="alt">
    {{ t().loginNoAccount }}
    <a routerLink="/register">{{ t().loginRegisterLink }}</a>
  </p>
</main>
