<nav class="nav" [class]="windowClass()" [attr.aria-label]="t().navLabel">
  @if (windowClass() === 'expanded') {
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">{{ t().appName }}</span>
    </div>
  }
  @for (tab of tabs; track tab.path) {
    <a
      class="tab"
      [routerLink]="tab.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span class="indicator">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path [attr.d]="tab.icon" />
        </svg>
      </span>
      <span class="label">{{ t()[tab.label] }}</span>
    </a>
  }
</nav>
<div class="main">
  <header class="app-bar">
    <svg class="app-bar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path [attr.d]="activeTab().icon" />
    </svg>
    @if (windowClass() === 'expanded') {
      <h1 class="app-bar-title">{{ tabTitle() }}</h1>
      <span class="app-bar-date">{{ date() }}</span>
    } @else {
      <h1 class="app-bar-title">{{ title() }}</h1>
    }
    <button
      type="button"
      class="app-bar-exit"
      [class.app-bar-exit-pushed]="windowClass() !== 'expanded'"
      [attr.aria-label]="t().settingsLogout"
      [disabled]="pending()"
      (click)="logout()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
      </svg>
    </button>
  </header>
  <p class="app-bar-error" aria-live="polite">
    @if (failed()) {
      {{ t().authErrorUnknown }}
    }
  </p>
  <div class="content">
    <router-outlet />
  </div>
</div>
